[package]
name = "flint"
version = "0.3.0"
description = "A focused, instance-based Minecraft Java Edition launcher"
authors = ["Flint contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "flint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
futures = "0.3"
regex = "1"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
discord-rich-presence = "1.1"
png = "0.17"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
